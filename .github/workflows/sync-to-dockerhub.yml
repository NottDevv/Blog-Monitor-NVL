name: Sync GHCR Image to Docker Hub

on:
  workflow_dispatch: # این بخش باعث می‌شود اجرای ورک‌فلو فقط دستی باشد

jobs:
  sync-image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from GHCR, Tag, and Push to Docker Hub
        run: |
          # ۱. دریافت آخرین نسخه از گیتهاب
          docker pull ghcr.io/nottdevv/blog-monitor-nvl-v2:latest
          
          # ۲. تغییر تگ به ساختار داکرهاب
          docker tag ghcr.io/nottdevv/blog-monitor-nvl-v2:latest ${{ secrets.DOCKERHUB_USERNAME }}/blog-monitor-nvl-v2:latest
          
          # ۳. آپلود روی داکرهاب
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blog-monitor-nvl-v2:latest
