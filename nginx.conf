user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # مدیریت هوشمند آپگرید پروتکل (برای WS و HTTPUpgrade)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        
        # 1. سایت استتار (صفحه اصلی)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. پنل مدیریت (Dashboard) - مسیر داینامیک شده
        location _PANEL_PATH_ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding ""; # برای کارکرد sub_filter ضروری است
            
            # تزریق آیکون و تغییر تایتل
            sub_filter '<head>' '<head><link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"><script>document.title="_TITLE_HERE_";Object.defineProperty(document,"title",{value:"_TITLE_HERE_",writable:false});</script>';
            sub_filter_once on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # اطمینان از اینکه فایل آیکون مستقیم سرویس دهی می شود
        location = /favicon.ico {
            root /usr/share/nginx/html;
            access_log off;
            expires max;
        }

        # 3. لینک سابسکریپشن - مسیر و پورت داینامیک شده
        location _SUB_PATH_ {
            proxy_pass http://127.0.0.1:_SUB_PORT_;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # جادوی Regex: ساپورت نامحدود پورت‌ها - پیشوند داینامیک شده
        # آدرس باید این شکلی باشد: /api/v8443/ یا /api/v8445/
        # در پنل X-UI (بخش Path): تهِ آدرس اسلش باشد (مثلاً /api/v8443/)
        # در گوشی (بخش Path): تهِ آدرس اسلش باشد (مثلاً /api/v8443/?ed=2560)
        location ~ ^_API_PREFIX_(?<target_port>\d+)/ {
            proxy_redirect off;
            # استفاده از متغیر target_port که در بالا تعریف کردیم
            proxy_pass http://127.0.0.1:$target_port;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # اجازه عبور پارامترهایی مثل ?ed=2560
            proxy_set_header X-Original-URI $request_uri;
        }

        # 5. مسیر اختصاصی برای gRPC
        # در پنل: پورت را 8510 و Service Name را grpc-api بگذارید
        location /grpc-api {
            if ($request_method != "POST") { return 404; }
            client_body_buffer_size 1m;
            client_max_body_size 0;
            grpc_read_timeout 1d;
            grpc_send_timeout 1d;
            grpc_pass grpc://127.0.0.1:8510;

            # انتقال IP واقعی در gRPC
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
